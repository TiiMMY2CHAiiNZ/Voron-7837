[gcode_macro set_chamber_leds_white]
gcode:
    SET_LED_EFFECT EFFECT=chamber_white

[gcode_macro set_nozzle_leds_white]
gcode:
    SET_LED_EFFECT EFFECT=sb_nozzle_white

[gcode_macro set_rgb_off]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=chamber_off
    SET_LED_EFFECT EFFECT=sb_nozzle_off
    SET_LED_EFFECT EFFECT=sb_logo_off
    SET_LED_EFFECT EFFECT=tophat_logos_off
    STOP_LED_EFFECTS

[gcode_macro status_ready_rgb]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=rainbow

[gcode_macro status_part_ready_rgb]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=chamber_printcomplete
    SET_LED_EFFECT EFFECT=sb_nozzle_printcomplete
    SET_LED_EFFECT EFFECT=sb_logo_printcomplete
    SET_LED_EFFECT EFFECT=tophat_logos_red

[gcode_macro status_heating_rgb]
