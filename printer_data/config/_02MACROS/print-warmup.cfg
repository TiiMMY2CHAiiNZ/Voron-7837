[gcode_macro _PRINT_WARMUP]
description: Perform initial bed and chamber heating task
gcode:
    {% set BED_TEMP = params.BED_TEMP | default(60) | float %}

    STATUS_HEATING_RGB
    RESPOND MSG=">>> HEAT SOAKING BED & CHAMBER <<<"
    {% if BED_TEMP >= 80 %}
      HEAT_SOAK HEATER='heater_bed' TARGET={BED_TEMP} SOAKER='temperature_sensor 5._Bed_Surface_Temperature' SOAK_TEMP={BED_TEMP * 0.95} RATE=0.25 TEMP_SMOOTH=6 RATE_SMOOTH=30 CANCEL='CANCEL_PRINT' TIMEOUT=30 HEATING_REPORT_INTERVAL=5 SOAKING_REPORT_INTERVAL=5
    {% else %}
      HEAT_SOAK HEATER='heater_bed' TARGET={BED_TEMP} SOAKER='temperature_sensor 5._Bed_Surface_Temperature' SOAK_TEMP={BED_TEMP} RATE=0.375 TEMP_SMOOTH=4 RATE_SMOOTH=30 CANCEL='CANCEL_PRINT' TIMEOUT=30 HEATING_REPORT_INTERVAL=5 SOAKING_REPORT_INTERVAL=5
    {% endif %}  