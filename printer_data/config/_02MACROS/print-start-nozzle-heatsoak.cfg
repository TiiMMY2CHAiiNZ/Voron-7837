[gcode_macro _PRINT_START_NOZZLE_HEAT_SOAK]
description: Heats the nozzle to 150°C and holds for 45 seconds prior to scrubbing nozzle to ensure the heat block and nozzle expand fully
gcode:
	STATUS_HEATING_RGB
    RESPOND MSG=">>> HEATING NOZZLE TO 150°C <<<"
    M109 S150
    RESPOND MSG=">>> STARTING NOZZLE HEAT SOAK AT 150°C FOR 00:45 <<<"
    G4 P15000  # Pause for 15 seconds(15,000 ms)
    RESPOND MSG=">>> NOZZLE HEAT SOAKING AT 150°C - PROGRESS 00:15/00:45 <<<"
    G4 P15000  # Pause for 15 seconds(15,000 ms)
    RESPOND MSG=">>> NOZZLE HEAT SOAKING AT 150°C - PROGRESS 00:30/00:45 <<<"
    G4 P15000  # Pause for 15 seconds(15,000 ms)
    RESPOND MSG=">>> NOZZLE HEAT SOAK AT 150°C COMPLETE <<<"