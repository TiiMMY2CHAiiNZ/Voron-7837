[gcode_macro NOZZLE_WIPE_PARK]
gcode:
  {% set wipe_park_z = 5.0 %}
  {% set z_speed = 1500 %}
  {% set travel_speed = 7500 %}
  {% set wipe_park_x = 93 %}
  {% set wipe_park_y = 355 %}
  
  {% if not printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 X{wipe_park_x} Y{wipe_park_y} F{travel_speed}
  G1 Z{wipe_park_z} F{z_speed}
  
    
[gcode_macro NOZZLE_WIPE]
gcode:
  {% set wipe_z = 3.78 %}
  {% set z_speed = 1500 %}
  {% set travel_speed = 7500 %}
  {% set wipe_x_left = 93 %}
  {% set wipe_x_right = 108 %}
  {% set wipe_y = 355 %}

  RESPOND MSG=">>> WIPING NOZZLE <<<"
  {% if not printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 X{wipe_x_left} Y{wipe_y} F{travel_speed}
  G1 Z{wipe_z} F{z_speed}
  G1 X{wipe_x_right} Y{wipe_y} F{travel_speed}
  G1 X{wipe_x_left} Y{wipe_y} F{travel_speed}
  G1 X{wipe_x_right} Y{wipe_y} F{travel_speed}
  G1 X{wipe_x_left} Y{wipe_y} F{travel_speed}
  G1 X{wipe_x_right} Y{wipe_y} F{travel_speed}
  G1 X{wipe_x_left} Y{wipe_y} F{travel_speed}
  G1 X{wipe_x_right} Y{wipe_y} F{travel_speed}
  G1 X{wipe_x_left} Y{wipe_y} F{travel_speed}