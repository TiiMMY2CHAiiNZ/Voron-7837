[gcode_macro FILAMENT_SENSORS_ENABLE]
description: Enable all filament sensors
gcode:
  SET_FILAMENT_SENSOR SENSOR=BTT_SFS_Filament_Switch ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=BTT_SFS_Encoder ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=Toolhead_Filament_Switch_TOP ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=Toolhead_Filament_Switch_BOTTOM ENABLE=1