[gcode_macro NOZZLE_SCRUB_PARK]
gcode:
  {% set scrub_park_z = 5.0 %}
  {% set z_speed = 1500 %}
  {% set travel_speed = 7500 %}
  {% set scrub_x_left = 232 %}
  {% set scrub_y = 351 %}
  
  {% if not printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 X{scrub_x_left} Y{scrub_y} F{travel_speed}
  G1 Z{scrub_park_z} F{z_speed}
    
[gcode_macro NOZZLE_SCRUB]
gcode:
  {% set scrub_z = 1.38 %}
  {% set scrub_park_z = 5.0 %}
  {% set z_speed = 1500 %}
  {% set travel_speed = 7500 %}
  {% set scrub_x_a = 232 %}
  {% set scrub_x_b = 236.6 %}    # 236.5875
  {% set scrub_x_c = 241.2 %}    # 241.175
  {% set scrub_x_d = 245.8 %}    # 245.7625
  {% set scrub_x_e = 250.4 %}    # 250.35
  {% set scrub_x_f = 254.9 %}    # 254.9375
  {% set scrub_x_g = 259.5 %}    # 259.525
  {% set scrub_x_h = 264.1 %}    # 264.1125
  {% set scrub_x_i = 268.7 %}
  {% set scrub_y_front = 347.5 %}
  {% set scrub_y_middle = 351 %}
  {% set scrub_y_back = 354.5 %}

  RESPOND MSG=">>> SCRUBBING NOZZLE <<<"
  {% if not printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
      # START AT FAR LEFT, MIDDLE
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
      # MOVE TO CORRECT Z-HEIGHT
  G1 Z{scrub_z} F{z_speed}
      # STRAIGHT ACROSS, LEFT TO RIGHT
  G1 X{scrub_x_i} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
      # ZIG-ZAG WIDE, LEFT TO RIGHT
  G1 X{scrub_x_c} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_e} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_g} Y{scrub_y_back} F{travel_speed}
      # STRAIGHT ACROSS, RIGHT TO LEFT
  G1 X{scrub_x_i} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_i} Y{scrub_y_middle} F{travel_speed}
      # ZIG-ZAG WIDE, RIGHT TO LEFT
  G1 X{scrub_x_g} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_e} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_c} Y{scrub_y_front} F{travel_speed}
      # STRAIGHT ACROSS, LEFT TO RIGHT
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_i} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
      # ZIG-ZAG TIGHT, LEFT TO RIGHT
  G1 X{scrub_x_b} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_c} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_d} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_e} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_f} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_g} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_h} Y{scrub_y_back} F{travel_speed}
      # STRAIGHT ACROSS, RIGHT TO LEFT
  G1 X{scrub_x_i} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_i} Y{scrub_y_middle} F{travel_speed}
      # ZIG-ZAG TIGHT, RIGHT TO LEFT
  G1 X{scrub_x_h} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_g} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_f} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_e} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_d} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_c} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_b} Y{scrub_y_front} F{travel_speed}
      # STRAIGHT ACROSS, LEFT TO RIGHT
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_i} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
      # ZIG-ZAG ULTRAWIDE, RIGHT TO LEFT
  G1 X{scrub_x_h} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_b} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_g} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_c} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_f} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_d} Y{scrub_y_middle} F{travel_speed}
      # ZIG-ZAG ULTRAWIDE, LEFT TO RIGHT
  G1 X{scrub_x_i} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_b} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_h} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_c} Y{scrub_y_back} F{travel_speed}
  G1 X{scrub_x_g} Y{scrub_y_front} F{travel_speed}
  G1 X{scrub_x_d} Y{scrub_y_middle} F{travel_speed}
  G1 X{scrub_x_f} Y{scrub_y_middle} F{travel_speed}
      # RETURN TO FAR LEFT MIDDLE
  G1 X{scrub_x_a} Y{scrub_y_middle} F{travel_speed}
      # RAISE NOZZLE BACK UP TO PARK HEIGHT
  G1 Z{scrub_park_z} F{z_speed}