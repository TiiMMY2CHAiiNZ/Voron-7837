# [gcode_macro CZ_TILT_ADJUST]
# gcode:
#     {% if printer.z_tilt.applied == False %} ; if not QGL'd
#         CG28 ; Home all axes if not homed
#         Z_TILT_ADJUST ; Z-tilt adjustment
#     {% endif %}