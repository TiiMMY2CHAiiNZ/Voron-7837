[gcode_macro _SBFAN]
variable_low: 0.5		# Fan speed when SB2240FANLOW is called
variable_max: 1.0       # fan speed when SB2240FANMAX is called
gcode:

[gcode_macro SBFANLOW]
description: Run SB2240 fan at 50% speed
gcode:
	{% set LOW = printer["gcode_macro _SBFAN"].low|float %}
	SET_FAN_SPEED FAN=SB2240_Fan SPEED={LOW}

[gcode_macro SBFANMAX]
description: Run SB2240 fan at 100% speed
gcode:
	{% set MAX = printer["gcode_macro _SBFAN"].max|float %}
	SET_FAN_SPEED FAN=SB2240_Fan SPEED={MAX}

[gcode_macro SBFANOFF]
description: Turn off SB2240 fan
gcode:
	SET_FAN_SPEED FAN=SB2240_Fan SPEED=0