[gcode_macro PARK_TOOLHEAD_FRONT_AND_CENTER_HIGH]
description: Moves the toolhad to the front-middle of the chamber at Z90 for easy access
gcode:
  {% set th = printer.toolhead %}
  {% if printer["gcode_macro status_busy"] != null %}
  {% endif %}
  G0 X{th.axis_maximum.x//2} Y5 Z90 F3600  
  {% if printer["gcode_macro status_ready"] != null %}
  {% endif %}

